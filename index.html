<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Officina Arcana</title>
<meta name="description" content="Scheda del personaggio di D&D in stile officina arcana.">
<meta name="theme-color" content="#1c1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Officina Arcana">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 50% 35%,#2a2119,#0d0c0b 75%);overflow:auto}
.au-card{width:min(380px,100%);display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 22px;border:1px solid #7d6330;border-radius:18px;background:linear-gradient(#24211d,#1a1814);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.au-logo{border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.au-card h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:32px;color:#e6c46e;margin:0}
.au-sub{margin:0;color:#a39780;font-size:15px}
#auForm{display:grid;gap:12px;width:100%;text-align:left}
.au-msg{min-height:1.2em;margin:0;font-size:14px;color:#f0a08f}.au-msg.ok{color:#a4e48f}
.au-main{padding:13px;font-size:17px;width:100%}
.au-alt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.au-link{background:none;border:0;color:#5cc8e6;font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
</style>
<script>
/* Ponte tra l'app e Firebase.
   L'app parla con claude.use("db") / claude.use("assets"): qui la stessa interfaccia è
   implementata sopra Firebase (accesso con email e password, dati in Firestore con cache offline).
   Ogni utente vede solo users/<suo id>/… */
(function(){
  let resolveReady;const ready=new Promise(r=>resolveReady=r);
  window.claude={use:name=>ready.then(api=>api[name]||null)};
  const assetCache={};
  window.assetSrc=id=>{if(assetCache[id])return assetCache[id];window.__loadAsset&&window.__loadAsset(id);return""};
  const $=s=>document.querySelector(s);
  const AUTH_ERR={"auth/invalid-credential":"Email o password non corretti.","auth/wrong-password":"Email o password non corretti.","auth/user-not-found":"Non esiste un account con questa email.",
    "auth/email-already-in-use":"Esiste già un account con questa email: usa Entra.","auth/weak-password":"La password deve avere almeno 6 caratteri.",
    "auth/invalid-email":"L'indirizzo email non è valido.","auth/missing-password":"Scrivi la password.","auth/network-request-failed":"Serve la connessione a internet per entrare la prima volta.",
    "auth/too-many-requests":"Troppi tentativi: aspetta qualche minuto e riprova."};
  function loginHtml(){return`<div class="au-card" role="dialog" aria-modal="true" aria-labelledby="auT">
    <img src="icons/icon-192.png" alt="" width="84" height="84" class="au-logo">
    <h1 id="auT">Officina Arcana</h1><p class="au-sub">La tua scheda del personaggio, su ogni dispositivo.</p>
    <form id="auForm" novalidate>
     <label class="f">Email<input id="auEmail" type="email" autocomplete="email" inputmode="email" required></label>
     <label class="f">Password<input id="auPass" type="password" autocomplete="current-password" minlength="6" required></label>
     <p id="auMsg" class="au-msg" role="alert"></p>
     <button class="btn au-main" type="submit" id="auGo">Entra</button>
     <div class="au-alt"><button type="button" class="au-link" id="auNew">Non hai un account? Crealo</button><button type="button" class="au-link" id="auReset">Password dimenticata?</button></div>
    </form></div>`}
  function showLogin(fb){
    let box=$("#auth");if(!box){box=document.createElement("div");box.id="auth";document.body.appendChild(box)}
    box.innerHTML=loginHtml();box.hidden=false;let mode="in";
    const msg=(t,ok)=>{const m=$("#auMsg");m.textContent=t||"";m.className="au-msg"+(ok?" ok":"")};
    const setMode=m=>{mode=m;$("#auGo").textContent=m==="in"?"Entra":"Crea account";$("#auNew").textContent=m==="in"?"Non hai un account? Crealo":"Hai già un account? Entra";$("#auPass").autocomplete=m==="in"?"current-password":"new-password";msg("")};
    $("#auNew").onclick=()=>setMode(mode==="in"?"up":"in");
    $("#auReset").onclick=async()=>{const e=$("#auEmail").value.trim();if(!e){msg("Scrivi la tua email, poi premi di nuovo “Password dimenticata?”.");return}
      try{await fb.reset(e);msg("Ti ho mandato un'email per scegliere una nuova password.",true)}catch(x){msg(AUTH_ERR[x.code]||"Non sono riuscito a mandare l'email.")}};
    $("#auForm").onsubmit=async ev=>{ev.preventDefault();const e=$("#auEmail").value.trim(),p=$("#auPass").value,b=$("#auGo");b.disabled=true;msg("");
      try{if(mode==="in")await fb.signIn(e,p);else await fb.signUp(e,p)}catch(x){msg(AUTH_ERR[x.code]||"Qualcosa non ha funzionato. Riprova.")}finally{b.disabled=false}};
  }
  function hideLogin(){const b=$("#auth");if(b){b.hidden=true;b.innerHTML=""}}
  async function shrink(blob){
    const url=URL.createObjectURL(blob);
    try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.82)}
    finally{URL.revokeObjectURL(url)}
  }
  window.__officinaMissingConfig=function(){let box=document.createElement("div");box.id="auth";document.body.appendChild(box);
    box.innerHTML=`<div class="au-card"><h1>Officina Arcana</h1><p class="au-sub">Manca la configurazione di Firebase nel file config.js.</p></div>`};
  window.__officinaStart=function(fb){
    let started=false;
    window.officinaLogout=async()=>{try{await fb.signOut()}catch(e){}try{localStorage.removeItem("oa.char")}catch(e){}location.reload()};
    fb.onUser(user=>{
      if(!user){if(started){location.reload();return}showLogin(fb);return}
      hideLogin();window.officinaUser={email:user.email,uid:user.uid};
      if(started)return;started=true;
      const base="users/"+user.uid+"/";
      const snap=d=>({id:d.id,exists:d.exists,data:()=>d.data,metadata:{hasPendingWrites:!!d.pending,fromCache:!!d.cache}});
      const fail=e=>window.dispatchEvent(new CustomEvent("officina-save-error",{detail:e}));
      const ref=path=>({path,id:path.split("/").pop(),
        get:async()=>snap(await fb.getDoc(path)),
        /* la scrittura va subito nella cache locale; il server la riceve quando c'è rete */
        set:data=>{fb.setDoc(path,JSON.parse(JSON.stringify(data))).catch(fail);return Promise.resolve()},
        update:data=>{fb.setDoc(path,JSON.parse(JSON.stringify(data)),true).catch(fail);return Promise.resolve()},
        delete:()=>fb.deleteDoc(path),
        onSnapshot:(next,err)=>fb.onSnapshot(path,d=>next(snap(d)),x=>err&&err({code:"unavailable",message:String(x&&x.message||x)}))});
      const db={doc:p=>ref(base+p),collection:p=>({get:async()=>{const list=await fb.getDocs(base+p);return{docs:list.map(d=>({id:d.id,exists:true,data:()=>d.data})),size:list.length,empty:!list.length}}})};
      const assets={
        upload:async blob=>{const url=await shrink(blob);const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
          assetCache[id]=url;fb.setDoc(base+"assets/"+id,{data:url}).catch(fail);return{id,url,sizeBytes:url.length,contentType:"image/jpeg"}},
        list:async()=>({assets:[],usage:{}}),
        delete:async id=>{await fb.deleteDoc(base+"assets/"+id);delete assetCache[id];return{deleted:true}}};
      window.__loadAsset=id=>{if(id in assetCache)return;assetCache[id]="";
        fb.getDoc(base+"assets/"+id).then(d=>{if(d.exists&&d.data&&d.data.data){assetCache[id]=d.data.data;window.dispatchEvent(new Event("officina-asset"))}}).catch(()=>{delete assetCache[id]})};
      resolveReady({db,assets});
    });
  };
})();

</script>
<script type="module">
import CONFIG from "./config.js";
if(!CONFIG||!CONFIG.apiKey){window.__officinaMissingConfig()}else{
  const [{initializeApp},A,F]=await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
  const app=initializeApp(CONFIG),auth=A.getAuth(app);
  let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}catch(e){fs=F.getFirestore(app)}
  const D=p=>F.doc(fs,p);
  window.__officinaStart({
    onUser:cb=>A.onAuthStateChanged(auth,cb),
    signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
    reset:e=>A.sendPasswordResetEmail(auth,e),
    signOut:()=>A.signOut(auth),
    getDoc:async p=>{const s=await F.getDoc(D(p));return{id:s.id,exists:s.exists(),data:s.data()}},
    setDoc:(p,d,merge)=>F.setDoc(D(p),d,merge?{merge:true}:undefined),
    deleteDoc:p=>F.deleteDoc(D(p)),
    onSnapshot:(p,n,e)=>F.onSnapshot(D(p),s=>n({id:s.id,exists:s.exists(),data:s.data(),pending:s.metadata.hasPendingWrites,cache:s.metadata.fromCache}),e),
    getDocs:async p=>{const q=await F.getDocs(F.collection(fs,p));return q.docs.map(d=>({id:d.id,data:d.data()}))}
  });
}
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&display=swap">
<script src="vendor/lucide.min.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.min.js"></script>
<style>
/* Layout: officina notturna. Lastre di ferro brunito su carta da progetto blu, rifiniture in ottone,
   energia arcana in ciano. Mobile: barra in basso. Tablet: binario laterale. Tema unico scuro, voluto. */
:root{
  color-scheme: dark;
  --iron:#121110; --plate:#1c1a17; --plate-2:#24211d; --line:#3a332a;
  --brass:#c9a24a; --brass-hi:#e6c46e; --brass-lo:#7d6330; --copper:#b8693a;
  --arcane:#5cc8e6; --arcane-lo:#1f4f5e; --parch:#ebdfc4; --muted:#a39780; --faint:#6f6656;
  --good:#7fbf6a; --bad:#d9634c; --warn:#e0a83a;
  --art:rgba(201,162,74,.24); --art-2:rgba(184,105,58,.26); --steam:rgba(235,223,196,.6);
  --f-display:"IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --r:10px;
}
html,body{background:var(--iron);color:var(--parch)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;background:radial-gradient(ellipse at 50% 35%,#1d1915 0%,var(--iron) 75%) fixed,var(--iron)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--plate)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--parch);background:var(--iron);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ic{width:20px;height:20px;stroke-width:1.75;flex:none}
svg.lucide{width:20px;height:20px;flex:none}
.sm svg.lucide,.sm .ic,svg.lucide.sm{width:16px;height:16px}
@media (max-width:400px){#topAc{display:none!important}}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--plate),#171512);border-bottom:1px solid var(--brass-lo);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top .mini{width:40px;height:40px;border-radius:50%;border:2px solid var(--brass);background:var(--plate-2) center 18%/cover;flex:none}
.top .who{min-width:0;flex:1}
.top .who b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--iron);font-size:13px}
.pill .num{font-size:18px;line-height:1}
.pill .pmax{font-size:14px;color:var(--muted);margin-left:1px}
.pill.hp{border-color:var(--copper)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--plate-2)}
.iconbtn:hover{border-color:var(--brass-lo)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok{background:var(--good)} .sync.err{background:var(--bad)} .sync.busy{background:var(--warn)}

/* ---------- main ---------- */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1180px;margin:0 auto;display:grid;gap:16px}
.plate{position:relative;background:linear-gradient(180deg,rgba(36,33,29,.84),rgba(28,26,23,.9));border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
/* bulloni a testa esagonale con taglio, ognuno girato in modo diverso */
.plate::before,.plate::after{content:"";position:absolute;top:6px;width:12px;height:12px;z-index:1;
  clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  background:linear-gradient(90deg,transparent 41%,rgba(28,18,6,.9) 41% 59%,transparent 59%) center/66% 66% no-repeat,
    radial-gradient(circle at 50% 50%,transparent 38%,rgba(60,42,14,.55) 40%,transparent 46%),
    radial-gradient(circle at 34% 28%,#f6dc93,#c49a45 45%,#6a4f1c 85%)}
.plate::before{left:6px;transform:rotate(18deg)}.plate::after{right:6px;transform:rotate(-37deg)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-inline:8px}
.ph h2{font-size:20px;color:var(--brass-hi);flex:1}
.ph .lbl{margin-left:auto}
.cols{display:grid;gap:16px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr;align-items:start}.cols.w3{grid-template-columns:1.1fr .9fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--brass-lo);background:linear-gradient(#2c271f,#211d17);color:var(--brass-hi);font-weight:500;font-size:15px}
.btn:hover{border-color:var(--brass)}
.btn.arc{border-color:var(--arcane-lo);color:var(--arcane);background:linear-gradient(#17262b,#121c20)}
.btn.bad{border-color:#6b2e22;color:#f0a08f;background:#24140f}
.btn.ghost{background:none;border-color:var(--line);color:var(--parch)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--brass);color:var(--brass-hi);background:rgba(201,162,74,.1)}
.chip.arc{border-color:var(--arcane-lo);color:var(--arcane)}
.chip.warn{border-color:#6b5320;color:var(--warn)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.portrait{width:112px;aspect-ratio:4/5;max-width:100%;border-radius:12px;border:2px solid var(--brass);box-shadow:0 0 0 4px var(--iron),0 0 0 5px var(--brass-lo);background:var(--plate-2) center 15%/cover;position:relative;display:grid;place-items:center;color:var(--faint)}
.portrait button{position:absolute;right:-8px;bottom:-8px}
@media (min-width:600px){.portrait{width:150px}}
.hero h1{font-size:clamp(26px,6vw,38px);line-height:1.05;color:var(--parch)}
.hero .sub{color:var(--brass);font-size:15px;margin-top:4px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xpbar{height:6px;border-radius:3px;background:var(--iron);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}

/* ---------- abilities ---------- */
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.abil{grid-template-columns:repeat(6,1fr)}}
.dial{display:grid;justify-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;background:var(--iron);border:1px solid var(--line)}
.dial:hover{border-color:var(--brass-lo)}
.dial .cog{position:relative;width:80px;height:80px;display:grid;place-items:center}
.dial .cog svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s cubic-bezier(.5,0,.3,1)}
.dial:hover .cog svg,.dial:focus-visible .cog svg{transform:rotate(30deg)}
.dial .cog .mv{position:relative;font-family:var(--f-num);font-size:30px;line-height:1;color:var(--parch)}
.dial .ab{font-size:12px;letter-spacing:.14em;color:var(--brass)}
.dial .sc{font-size:13px;color:var(--muted)}
.dial.save-prof .ab::after{content:" ◆";color:var(--arcane)}

/* ---------- lists ---------- */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:rgba(201,162,74,.04)}
.li .v{font-family:var(--f-num);font-size:20px;min-width:34px;text-align:right}
.li .a{font-size:11px;color:var(--faint);letter-spacing:.1em}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);display:inline-block;position:relative}
.dot.p1{border-color:var(--brass);background:radial-gradient(circle,var(--brass) 45%,transparent 50%)}
.dot.p2{border-color:var(--arcane);background:radial-gradient(circle,var(--arcane) 55%,transparent 60%);box-shadow:0 0 8px rgba(92,200,230,.5)}
.passives{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--iron);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;display:grid;gap:2px}
.tile .num{font-size:28px;line-height:1}
button.tile:hover{border-color:var(--brass-lo)}

details.fold{border-top:1px solid var(--line);padding:10px 8px}
details.fold:first-of-type{border-top:0}
details.fold summary{cursor:pointer;font-family:var(--f-display);font-size:17px;color:var(--brass-hi);list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";margin-left:auto;color:var(--muted)}
details.fold[open] summary::after{content:"–"}
details.fold .in{padding-top:10px;display:grid;gap:10px}
.trait b{color:var(--parch)} .trait p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* ---------- combat ---------- */
.gauge{display:grid;justify-items:center;gap:4px}
.gauge svg{width:100%;max-width:300px;height:auto;overflow:visible}
.gauge .read{margin-top:-6px;text-align:center}
.gauge .read .num{font-size:52px;line-height:1}
.gauge .read small{font-family:var(--f-num);font-size:20px;color:var(--muted)}
.hpctl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-top:14px;width:100%}
.hpctl input{text-align:center;font-family:var(--f-num);font-size:22px;padding:6px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.stats4{grid-template-columns:repeat(2,1fr)}}
.shield{clip-path:polygon(50% 0,100% 12%,100% 60%,50% 100%,0 60%,0 12%);padding-bottom:16px}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brass-lo);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.pip.full{background:radial-gradient(circle at 35% 35%,var(--brass-hi),var(--brass-lo));border-color:var(--brass);color:#2a1f0a}
.pip.good.full{background:var(--good);border-color:var(--good)} .pip.bad.full{background:var(--bad);border-color:var(--bad)}
.atk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line)}
.atk:last-child{border-bottom:0}
.atk .nm{font-weight:500} .atk .ds{font-size:13px;color:var(--muted)}
.atk .hit{font-family:var(--f-num);font-size:22px;color:var(--brass-hi);text-align:right}
.badgeic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--iron);border:1px solid var(--line);color:var(--brass)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.conds button.chip{cursor:pointer}

/* ---------- inventory ---------- */
.bar{height:10px;border-radius:5px;background:var(--iron);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-lo),var(--brass))}
.bar.over i{background:linear-gradient(90deg,#7a2c1f,var(--bad))}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coin{display:grid;gap:3px;text-align:center}
.coin input{text-align:center;font-family:var(--f-num);font-size:20px;padding:6px 2px}
.coin .lbl{font-size:10px}
.coin.gp .lbl{color:var(--brass-hi)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters .chip{white-space:nowrap;cursor:pointer;padding:6px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{aspect-ratio:1;max-width:100%;border-radius:10px;background:linear-gradient(145deg,#0d0c0b,#1a1815);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
  position:relative;display:grid;place-items:center;align-content:center;gap:4px;padding:6px;text-align:center}
.slot .lucide{width:30px;height:30px;color:var(--parch);stroke-width:1.5}
.slot .n{font-size:10.5px;line-height:1.15;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.slot .q{position:absolute;right:5px;top:4px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:rgba(0,0,0,.55);border:1px solid var(--brass-lo);font-family:var(--f-num);font-size:12px;line-height:16px;text-align:center;color:var(--parch)}
.bagslot .q{right:30px}
.slot.eq{border-color:var(--brass);box-shadow:inset 0 0 0 1px rgba(201,162,74,.35),inset 0 2px 6px rgba(0,0,0,.6)}
.slot.eq::after{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;transform:rotate(45deg);background:var(--brass)}
.slot.att{border-color:var(--arcane);box-shadow:0 0 10px rgba(92,200,230,.35),inset 0 2px 6px rgba(0,0,0,.6)}
.slot.empty{border-style:dashed;opacity:.45}
.slot.add{border-style:dashed;color:var(--brass)}
.slot.add .lucide{color:var(--brass)}
.slot .cnt{position:absolute;right:5px;top:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--brass);color:#1d160a;font-family:var(--f-num);font-size:12px;line-height:18px}
.slot.bagslot{background:linear-gradient(145deg,#120f0b,#221c14);border-color:#5a4826}
.slot .inbag{position:absolute;left:4px;bottom:3px;color:var(--brass);opacity:.8;line-height:0}
.baggrid .slot{animation:pop .25s both}
.baggrid .slot:nth-child(2){animation-delay:.03s}.baggrid .slot:nth-child(3){animation-delay:.06s}.baggrid .slot:nth-child(4){animation-delay:.09s}.baggrid .slot:nth-child(n+5){animation-delay:.12s}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.crumbs button{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;color:var(--brass-hi)}
.crumbs button:hover{background:rgba(201,162,74,.1)}.crumbs button[aria-current]{color:var(--parch)}
.iconpick{border:1px solid var(--line);border-radius:9px;background:var(--iron)}
.iconpick summary{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;list-style:none}
.iconpick summary::-webkit-details-marker{display:none}
.iconpick .isum{display:flex;align-items:center;gap:8px;flex:1;color:var(--parch)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:4px 10px 10px;max-height:260px;overflow:auto}
.iopt{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.iopt input{position:absolute;opacity:0;width:1px;height:1px}
.iopt:has(input:checked){border-color:var(--brass);background:rgba(201,162,74,.12);color:var(--brass-hi)}
.iopt:has(input:focus-visible){outline:2px solid var(--arcane)}
.slot.c-arma .lucide{color:#e7d2b0}.slot.c-magico .lucide{color:var(--arcane)}.slot.c-strumento .lucide{color:#d6a57a}.slot.c-tesoro .lucide{color:var(--brass-hi)}
.tint-sun .lucide{color:var(--brass-hi)!important}.tint-moon .lucide{color:#cfd6dc!important}

/* ---------- workshop ---------- */
.track{display:flex;gap:0;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.node{flex:0 0 132px;scroll-snap-align:start;position:relative;padding:0 6px}
.node::before{content:"";position:absolute;top:19px;left:0;right:0;height:2px;background:var(--line)}
.node.done::before{background:var(--brass)}
.node .lv{position:relative;width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-family:var(--f-num);font-size:20px;background:var(--iron);border:2px solid var(--line);color:var(--faint)}
.node.done .lv{border-color:var(--brass);color:var(--brass-hi)}
.node.cur .lv{background:var(--brass);color:#1d160a;box-shadow:0 0 0 4px rgba(201,162,74,.25)}
.node .ft{display:grid;gap:4px}
.node .ft button{font-size:12px;line-height:1.2;text-align:center;padding:5px 4px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--iron)}
.node.done .ft button{color:var(--parch);border-color:var(--brass-lo)}
.node .ft button.sub{border-style:dashed}
.lock{position:relative}
.lock .veil{position:absolute;inset:0;border-radius:var(--r);background:rgba(12,11,10,.72);backdrop-filter:blur(1.5px);display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:16px;z-index:2}
.lock .veil .lucide{width:30px;height:30px;color:var(--brass)}
.lock .veil b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--brass-hi)}
.tk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--iron)}
.tk select,.tk input{padding:6px 8px;font-size:14px}
.inflist{display:grid;gap:8px}
.inf{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--iron)}
.inf b{color:var(--parch)} .inf p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.inf.tip{border-color:var(--arcane-lo)}
.cannon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cannon button{padding:10px 6px;border-radius:9px;border:1px solid var(--line);background:var(--iron);display:grid;justify-items:center;gap:4px;font-size:13px}
.cannon button.on{border-color:var(--copper);color:#f2b48e;background:#22150e}

/* ---------- spells ---------- */
.crystals{display:grid;gap:10px}
.crow{display:flex;align-items:center;gap:10px}
.crow .lbl{width:58px}
.crys{width:24px;height:30px;clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%);background:linear-gradient(160deg,#bff0fb,var(--arcane) 45%,#13708a);box-shadow:0 0 12px var(--arcane)}
.crys.spent{background:linear-gradient(160deg,#2a3236,#151b1e);box-shadow:none}
.crys-wrap{display:flex;gap:6px}
.spell{border:1px solid var(--line);border-radius:10px;background:var(--iron);padding:10px 12px;display:grid;gap:6px}
.spell.prep{border-color:var(--arcane-lo)}
.spell .hd{display:flex;align-items:center;gap:8px}
.spell .hd b{font-weight:700;flex:1;min-width:0}
.spell .facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.spell p{margin:0;font-size:14px;color:#cdbfa4}
.spell .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvlh{font-family:var(--f-display);font-size:17px;color:var(--brass);margin:6px 2px 2px}
.sp-grid{display:grid;gap:8px}
@media (min-width:900px){.sp-grid{grid-template-columns:1fr 1fr}}

/* ---------- journal ---------- */
.qtxt{border:0;background:none;padding:2px;min-height:0;resize:none;overflow:hidden;line-height:1.4;font-size:16px}
.story-wrap{position:relative}
.story-wrap.clip .story,.story-wrap.clip .pfields{max-height:210px;overflow:hidden}
.story-wrap.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(rgba(28,26,23,0),rgba(28,26,23,.96));pointer-events:none}
.story{white-space:pre-wrap;font-size:15.5px;line-height:1.6;color:#d9cdb2;max-width:68ch}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--iron);display:grid;gap:4px}
.card .r{display:flex;gap:8px;align-items:center}
.card b{flex:1}
.cards{display:grid;gap:8px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}

/* ---------- nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:linear-gradient(#1a1815,var(--iron));border-top:1px solid var(--brass-lo);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs button{display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--faint);letter-spacing:.03em}
.tabs button.on{color:var(--brass-hi)}
.tabs button.on .lucide{filter:drop-shadow(0 0 6px rgba(230,196,110,.6))}
@media (min-width:900px){
  .tabs{top:0;right:auto;width:92px;grid-template-columns:1fr;align-content:center;gap:6px;border-top:0;border-right:1px solid var(--brass-lo);padding-top:env(safe-area-inset-top,0px)}
  .tabs button{padding:12px 0;font-size:12px}
  .top,main{margin-left:92px}
  main{padding-bottom:40px;margin-left:max(92px,calc((100% - 1180px)/2 + 46px))}
}

/* ---------- sheet & toast ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center}
#sheetWrap .bd{position:absolute;inset:0;background:rgba(5,5,4,.66)}
.sheet{position:relative;width:min(640px,100%);max-height:88vh;overflow:auto;background:linear-gradient(var(--plate-2),var(--plate));border:1px solid var(--brass-lo);border-bottom:0;border-radius:16px 16px 0 0;
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:700px){#sheetWrap{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--brass-lo);padding-bottom:20px}}
.sheet .sh{display:flex;align-items:center;gap:10px}
.sheet .sh h3{font-size:22px;color:var(--brass-hi);flex:1}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.sheet .kv dt{color:var(--muted)} .sheet .kv dd{margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;width:min(420px,calc(100% - 32px));display:grid;gap:8px;pointer-events:none}
@media (min-width:900px){#toast{bottom:24px;left:calc(50% + 46px)}}
.tst{pointer-events:auto;background:linear-gradient(#2a251d,#1d1a15);border:1px solid var(--brass);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:pop .18s ease-out}
.tst .t{font-size:13px;color:var(--muted)} .tst .big{grid-row:span 2;font-family:var(--f-num);font-size:40px;line-height:1;color:var(--brass-hi)}
.tst .br{font-size:13px;color:var(--parch)}
.tst.crit{border-color:var(--arcane);box-shadow:0 0 24px rgba(92,200,230,.4)} .tst.crit .big{color:var(--arcane)}
.tst.fumble{border-color:var(--bad)} .tst.fumble .big{color:var(--bad)}
.tst.msg{grid-template-columns:1fr}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tst{animation:none}*{transition:none!important}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brass);color:#1d160a}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media (max-width:420px){.dpick{grid-template-columns:repeat(4,1fr)}}
.dbtn{display:grid;justify-items:center;gap:2px;padding:8px 4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--iron);font-size:13px;color:var(--muted)}
.dbtn svg{width:34px;height:34px}
.dbtn.on{border-color:var(--brass);background:rgba(201,162,74,.12);color:var(--brass-hi)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dnum{font-size:26px;min-width:40px;text-align:center}
.qchips{display:flex;flex-wrap:wrap;gap:6px}.qchips .chip{cursor:pointer;padding:5px 12px;font-size:14px}
.btn.droll{padding:14px;font-size:17px;width:100%}
.dlog ol{list-style:none;margin:6px 0 0;padding:0;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--iron)}
.dlog li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:5px 10px;border-bottom:1px dashed var(--line);font-size:13px}
.dlog li:last-child{border-bottom:0}
.dl-t{color:var(--faint);font-variant-numeric:tabular-nums}
.dl-w{display:grid;min-width:0}.dl-w b{font-weight:500;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl-w span{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.dl-v{font-size:20px;color:var(--brass-hi)}
.empty-state{display:grid;justify-items:center;text-align:center;gap:12px;padding:48px 16px}
.empty-state>.lucide{width:44px;height:44px;color:var(--brass)}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.warnbox{border:1px solid #6b5320;background:rgba(224,168,58,.07);border-radius:9px;padding:8px 10px;font-size:13.5px;color:#e9cf98}
main{position:relative;z-index:1}

/* ---------- sfondo: muro di ingranaggi ---------- */
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#0c0c0d}
#bgart canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgart::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(12,11,10,.12) 0%,rgba(12,11,10,.5) 62%,rgba(6,6,6,.88) 100%)}

/* ---------- animazione livello ---------- */
#lvlfx{position:fixed;inset:0;z-index:70;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 45%,rgba(29,24,17,.9),rgba(5,5,4,.95))}
.lf-in{display:grid;justify-items:center;gap:10px;text-align:center;padding:16px}
.lf-gears{position:relative;width:250px;height:250px}
.lf-big{position:absolute;left:15px;top:15px;width:220px;height:220px;filter:drop-shadow(0 0 18px rgba(230,196,110,.35))}
.lf-small{position:absolute;left:170px;top:170px;width:116px;height:116px}
.lf-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:92px;line-height:1;color:var(--brass-hi);text-shadow:0 0 18px rgba(230,196,110,.5)}
#lvlfx.go .lf-big{animation:rot 1.9s cubic-bezier(.6,0,.25,1) both}
#lvlfx.go .lf-small{animation:lfrev 1.9s cubic-bezier(.6,0,.25,1) both}
@keyframes lfrev{to{transform:rotate(-640deg)}}
.lf-num.pop{animation:lfpop .55s ease-out}
@keyframes lfpop{0%{transform:scale(.5);filter:blur(5px);opacity:.2}60%{transform:scale(1.18);opacity:1}100%{transform:none}}
.lf-steam{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(235,223,196,.55),transparent 70%);opacity:0}
#lvlfx.go .lf-steam{animation:lfsteam 1.8s .7s ease-out both}
#lvlfx.go .lf-steam.b{animation-delay:.9s}
@keyframes lfsteam{0%{opacity:0;transform:scale(.3)}25%{opacity:.9}100%{opacity:0;transform:translateY(-90px) scale(2.6)}}
.lf-t{font-family:var(--f-display);font-size:36px;color:var(--brass-hi);opacity:0;animation:fadeup .5s 1.4s forwards}
.lf-f{color:var(--parch);max-width:32ch;opacity:0;animation:fadeup .5s 1.6s forwards}
#lvlfx .lbl{opacity:0;animation:fadeup .5s 2.1s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#lvlfx *{animation:none!important;opacity:1!important}}
/* ---------- battaglia ---------- */
.gauge{position:relative}
.gauge svg{max-width:330px}
.gauge .tnum{color:var(--arcane);font-size:14px;min-height:1.2em}
.gauge.dmg svg{animation:gshake .5s}
.gauge.dmg #gArc{filter:drop-shadow(0 0 9px var(--bad))}
@keyframes gshake{0%,100%{transform:none}15%{transform:translate(-6px,1px) rotate(-1.2deg)}35%{transform:translate(5px,-1px) rotate(1deg)}55%{transform:translate(-4px,0)}75%{transform:translate(3px,0)}}
.gauge.heal svg{animation:gheal 1.3s}
@keyframes gheal{30%{filter:drop-shadow(0 0 16px rgba(127,191,106,.85))}}
.gauge.tmp svg{animation:gtmp 1.3s}
@keyframes gtmp{30%{filter:drop-shadow(0 0 16px rgba(92,200,230,.85))}}
.gauge.low #gArc{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--bad))}}
.floatnum{position:absolute;left:50%;top:30%;font-family:var(--f-num);font-weight:800;font-size:44px;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.9);animation:floatup 1.5s ease-out forwards;white-space:nowrap}
.floatnum.dmg{color:#ff7a62}.floatnum.heal{color:#a4e48f}.floatnum.tmp{color:var(--arcane);font-size:32px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.12)}100%{opacity:0;transform:translate(-50%,-70px)}}
.gpuff{position:absolute;top:30%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(235,223,196,.65),transparent 70%);opacity:0;pointer-events:none}
.gpuff.l{left:0}.gpuff.r{right:0}
.gauge.dmg .gpuff{animation:gpuff 1.3s ease-out}
@keyframes gpuff{0%{opacity:0;transform:scale(.3)}20%{opacity:.9}100%{opacity:0;transform:translateY(-60px) scale(2.3)}}
.actile{position:relative;background:none!important;border:0!important;min-height:104px;align-content:center;padding-bottom:18px}
.actile .shieldsvg{position:absolute;left:50%;top:50%;height:100%;width:auto;max-width:100%;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.actile>span{position:relative}
.actile .num{font-size:32px;color:var(--parch)}
.d8row{display:flex;gap:6px;flex-wrap:wrap}
.d8{width:42px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));transition:transform .4s}
.d8row .d8:hover{transform:rotate(-12deg) scale(1.08)}
.ds-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px}
.dpip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--iron);color:var(--faint)}
.dpip.good.full{border-color:#e8d59a;color:#3b2d0c;background:radial-gradient(circle at 40% 35%,#fff7dc,#d9bd6e);box-shadow:0 0 12px rgba(255,226,150,.5)}

/* ---------- ingranaggi e sfondo ---------- */
function gearD(n,R,r,holes){
  const st=Math.PI*2/n;let d="";
  for(let i=0;i<n;i++){const a=i*st;
    [[r,a],[R,a+st*.18],[R,a+st*.42],[r,a+st*.6]].forEach(([rr,aa],j)=>{d+=(i||j?"L":"M")+(rr*Math.cos(aa)).toFixed(2)+" "+(rr*Math.sin(aa)).toFixed(2)})}
  d+="Z";
  for(const [cx,cy,hr] of (holes||[]))d+=`M${(cx+hr).toFixed(2)} ${cy.toFixed(2)}a${hr} ${hr} 0 1 0 ${-2*hr} 0a${hr} ${hr} 0 1 0 ${2*hr} 0Z`;
  return d;
}
const spokes=(k,rad,hr)=>Array.from({length:k},(_,i)=>{const a=i*2*Math.PI/k-Math.PI/2;return[rad*Math.cos(a),rad*Math.sin(a),hr]});
const COG_SVG=`<svg viewBox="-50 -50 100 100" aria-hidden="true"><path d="${gearD(12,48,40,[])}" fill="var(--plate-2)" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round"/><circle r="33" fill="var(--iron)" stroke="var(--brass-lo)" stroke-width="1.5"/>${spokes(6,37,1.6).map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="var(--brass-lo)"/>`).join("")}</svg>`;
/* Muro di ingranaggi: treni di ingranaggi che ingranano davvero (stesso modulo, fase allineata,
   velocità inversamente proporzionale ai denti), su tre piani di profondità. Ogni ingranaggio
   è disegnato una volta in un'immagine e poi solo ruotato, così resta leggero anche sul telefono. */
const GearWall=(()=>{
  let host,cv,ctx,W=0,H=0,layers=[],t0=performance.now(),raf=0,last=0,rt=0;
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MATS={steel:[[96,106,118],[30,34,40]],iron:[[66,70,77],[22,24,27]],brass:[[160,128,64],[52,39,18]],copper:[[146,90,58],[48,26,16]]};
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  const col=(c,k)=>`rgb(${c.map(v=>Math.min(255,Math.round(v*k))).join(",")})`;
  const matPick=()=>{const r=Math.random();return r<.48?"steel":r<.68?"iron":r<.9?"brass":"copper"};
  const mk=(n,m,x,y)=>{const rp=m*n/2;return{n,m,x,y,rp,R:rp+m*.95,r:rp-m*1.15,phi:0,w:0,mat:matPick(),style:pick(["spokes","spokes","holes","solid"]),k:pick([4,5,6,6,8])}};
  function sprite(g,shade,blur,dpr){
    const pad=Math.ceil(blur*2.5+3),S=Math.ceil((g.R+pad)*2*dpr),c=document.createElement("canvas");c.width=c.height=S;
    const x=c.getContext("2d");x.scale(dpr,dpr);x.translate(S/2/dpr,S/2/dpr);if(blur)x.filter=`blur(${blur}px)`;
    const [hi,lo]=MATS[g.mat],big=g.rp>g.m*6.5,hub=Math.max(g.m*2.2,g.r*.22),rim=g.r-Math.max(g.m*1.4,g.r*.12),axle=Math.max(2.5,g.m*.8);
    const body=new Path2D(gearD(g.n,g.R,g.r,[]));
    const gr=x.createRadialGradient(0,0,g.r*.15,0,0,g.R);gr.addColorStop(0,col(hi,shade*1.08));gr.addColorStop(.72,col(hi,shade*.82));gr.addColorStop(1,col(lo,shade*1.1));
    x.fillStyle=gr;x.fill(body);x.lineWidth=1.2;x.strokeStyle=col(lo,shade*.6);x.stroke(body);
    x.save();x.globalCompositeOperation="destination-out";
    if(big&&g.style==="spokes"){const k=g.k,sw=Math.max(g.m*.9,g.r*.09),ri=hub*1.45;
      for(let i=0;i<k;i++){const a0=i*2*Math.PI/k,a1=a0+2*Math.PI/k;x.beginPath();x.arc(0,0,rim,a0+sw/rim/2,a1-sw/rim/2);x.arc(0,0,ri,a1-sw/ri/2,a0+sw/ri/2,true);x.closePath();x.fill()}}
    else if(big&&g.style==="holes"){const k=g.k,rr=(hub*1.4+rim)/2,hr=Math.min((rim-hub*1.4)/2*.82,rr*Math.PI/k*.7);
      for(let i=0;i<k;i++){const a=i*2*Math.PI/k;x.beginPath();x.arc(rr*Math.cos(a),rr*Math.sin(a),hr,0,7);x.fill()}}
    x.beginPath();x.arc(0,0,axle,0,7);x.fill();x.restore();
    x.strokeStyle=col(lo,shade*.75);x.lineWidth=Math.max(1,g.m*.25);
    if(big){x.beginPath();x.arc(0,0,rim,0,7);x.stroke()}
    if(big&&g.style==="solid"){x.lineWidth=1;for(const f of[.5,.72]){x.beginPath();x.arc(0,0,g.r*f,0,7);x.stroke()}}
    const hg=x.createRadialGradient(0,0,axle,0,0,hub);hg.addColorStop(0,col(hi,shade*1.3));hg.addColorStop(1,col(lo,shade*1.25));
    x.fillStyle=hg;x.beginPath();x.arc(0,0,hub,0,7);x.arc(0,0,axle,0,7,true);x.fill("evenodd");x.stroke();
    if(hub>8){const b=hub*.66,bn=g.k>5?6:4;x.fillStyle=col(lo,shade*.5);for(let i=0;i<bn;i++){const a=i*2*Math.PI/bn;x.beginPath();x.arc(b*Math.cos(a),b*Math.sin(a),Math.max(1.3,hub*.1),0,7);x.fill()}}
    return{c,S,dpr};
  }
  function build(L){
    const gears=[],m=L.m;
    const fits=(g,par)=>{if(g.x<-g.R*.55||g.x>W+g.R*.55||g.y<-g.R*.55||g.y>H+g.R*.55)return false;
      for(const o of gears){if(o===par)continue;if(Math.hypot(o.x-g.x,o.y-g.y)<o.R+g.R+1.5)return false}return true};
    for(let s=0;s<L.seeds;s++){
      let x,y,t=0;do{x=rnd(0,W);y=rnd(0,H);t++}while(t<50&&gears.some(o=>Math.hypot(o.x-x,o.y-y)<o.R+m*5));
      if(t>=50)break;
      const g0=mk(Math.round(rnd(L.nMin,L.nMax)),m,x,y);if(!fits(g0,null))continue;
      g0.phi=rnd(0,6.283);g0.w=(Math.random()<.5?-1:1)*L.speed*20/g0.n;gears.push(g0);
      const q=[g0];
      while(q.length){const p=q.shift();
        for(let a=0;a<L.tries;a++){
          const n=Math.round(rnd(L.nMin,L.nMax)),th=rnd(0,6.283),d=p.rp+m*n/2,g=mk(n,m,p.x+d*Math.cos(th),p.y+d*Math.sin(th));
          if(!fits(g,p))continue;
          const sp=2*Math.PI/p.n,sc=2*Math.PI/n;
          g.w=-p.w*p.n/n; g.phi=th+Math.PI-.3*sc-sc/2+(p.n/n)*(th-p.phi-.3*sp);
          gears.push(g);q.push(g);
        }}
    }
    const dpr=Math.min(L.blur?1:1.5,window.devicePixelRatio||1);
    for(const g of gears)g.sp=sprite(g,L.shade,L.blur,dpr);
    return{gears};
  }
  function size(){const w=innerWidth,h=innerHeight,dpr=Math.min(1.5,window.devicePixelRatio||1);
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv._dpr=dpr;return[w,h]}
  function rebuild(){
    const[w,h]=size();W=w;H=Math.max(h,600);
    const sc=Math.max(.6,Math.min(1.15,w/1100));
    layers=[
      build({m:6*sc,nMin:14,nMax:46,speed:.045,shade:.42,blur:2.5,seeds:40,tries:14}),
      build({m:8.5*sc,nMin:10,nMax:42,speed:.075,shade:.8,blur:0,seeds:24,tries:16})
    ];
  }
  function draw(t){const d=cv._dpr;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    for(const L of layers)for(const g of L.gears){const a=g.phi+g.w*t,c=Math.cos(a)*d,s=Math.sin(a)*d,z=g.sp.S/g.sp.dpr;
      ctx.setTransform(c,s,-s,c,g.x*d,g.y*d);ctx.drawImage(g.sp.c,-z/2,-z/2,z,z)}}
  function loop(now){raf=requestAnimationFrame(loop);if(!document.querySelector('#rollWin:not([hidden]),#fx:not([hidden]),#lvlfx:not([hidden])'))draw((now-t0)/1000)}
  function start(){cancelAnimationFrame(raf);if(still||document.hidden){draw((performance.now()-t0)/1000);return}raf=requestAnimationFrame(loop)}
  return{init(el){host=el;cv=document.createElement("canvas");host.appendChild(cv);ctx=cv.getContext("2d");rebuild();start();
    let lw=innerWidth,lh=innerHeight;
    addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const big=Math.abs(innerWidth-lw)>40||innerHeight-lh>160;lw=innerWidth;lh=innerHeight;
      if(big)rebuild();else size();draw((performance.now()-t0)/1000)},250)});
    document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else start()});}};
})();

  else ac=10+mod("dex");

/* ---------- dadi ---------- */
function rollExpr(expr){
  let total=0;const parts=[];
  String(expr).replace(/\s/g,"").replace(/([+-]?)(\d*)d(\d+)|([+-]?\d+)/g,(m,s,n,f,k)=>{
    if(f){const sg=s==="-"?-1:1;for(let i=0;i<(+n||1);i++){const r=1+Math.floor(Math.random()*+f);parts.push(r);total+=sg*r}}
    else if(k){total+=+k}
    return"";});
  return{total,parts};
}
function d20(){const a=1+Math.floor(Math.random()*20),b=1+Math.floor(Math.random()*20);
  if(rollMode==="adv")return{v:Math.max(a,b),txt:`${a} | ${b} (vant.)`};
  if(rollMode==="dis")return{v:Math.min(a,b),txt:`${a} | ${b} (svant.)`};
  return{v:a,txt:`${a}`};}
function rollCheckOld(label,bonus,opts={}){
  const ex=+C.exhaustion||0, pen=ex*2;
  const r=d20(); const tot=r.v+bonus-pen;
  let br=`d20 ${r.txt} ${sgn(bonus)}`+(pen?` −${pen} esaurimento`:"");
  let extra="";
  if(opts.dmg){const crit=r.v===20;let ex2=opts.dmg;if(crit)ex2=ex2.replace(/(\d*)d(\d+)/g,(m,n,f)=>`${(+n||1)*2}d${f}`);const d=rollExpr(ex2);extra=`Danni${crit?" (critico)":""}: <b>${d.total}</b> ${esc(opts.dmgType||"")} <span class="muted">[${d.parts.join(", ")}]</span>`}
  toast({title:label,big:tot,br,extra,cls:r.v===20?"crit":r.v===1?"fumble":""});
  if(rollMode!=="norm"){rollMode="norm";if(tab==="battaglia")render()}
}
function rollDamageOld(label,expr,type){const d=rollExpr(expr);toast({title:label,big:d.total,br:`${esc(expr)} → [${d.parts.join(", ")}] ${esc(type||"")}`})}
function toast(o){
  const el=document.createElement("div");
  el.className="tst "+(o.cls||"")+(o.big===undefined?" msg":"");
  el.innerHTML=o.big===undefined?`<span class="br">${o.html||esc(o.title)}</span>`:`<span class="t">${esc(o.title)}</span><span class="big">${o.big}</span><span class="br">${o.br}</span>${o.extra?`<span class="br" style="grid-column:1/-1">${o.extra}</span>`:""}`;
  el.onclick=()=>el.remove();
  const box=$("#toast");box.prepend(el);while(box.children.length>3)box.lastChild.remove();
  if(o.big!==undefined){rollLog.unshift(`${o.title}: ${o.big}`);rollLog=rollLog.slice(0,12)}
  setTimeout(()=>el.remove(),o.big===undefined?3200:6500);
}

function setSync(s){$("#sync").className="sync "+s;$("#sync").title={ok:"Salvato",err:"Errore di salvataggio",busy:"Salvataggio…"}[s]||""}
function save(){ if(readOnly){toast({title:"Questa scheda è in sola lettura per te."});return}
  dirty=true;setSync("busy");clearTimeout(saveTimer);saveTimer=setTimeout(flush,650)}
async function flush(retry){
  if(!dirty)return; if(saving){saveTimer=setTimeout(flush,400);return}
  dirty=false;saving=true;const body=clone(C);
  try{ if(ref)await ref.set(body); else lsSet("oa.local."+charId,JSON.stringify(body)); setSync("ok") }
  catch(e){
    if(e?.code==="invalid_argument"){readOnly=true;setSync("err");toast({title:"Non hai i permessi per modificare questa scheda."})}
    else if(e?.code==="unavailable"&&!retry){dirty=true;saving=false;setTimeout(()=>flush(true),1500+Math.random()*1000);return}
    else{setSync("err");dirty=true;toast({title:"Salvataggio non riuscito: riprovo alla prossima modifica."})}
  } finally{saving=false}
}

  if(C.death.s>=3&&prev.s<3){C.stable=true;C.death={s:0,f:0};angelFx("Stabilizzato",`${name} è stabile a 0 PF: non tira più i TS contro la morte finché non subisce danni.`)}
  else if(C.death.f>=3&&prev.f<3)bloodFx();
}

function castSpellX(id,slot){
  const s=allSpells().find(x=>x.id===id);if(!s)return;
  if(s.lvl>0&&!slot){const sl=slotsArr(),opts=sl.map((n,i)=>({lv:i+1,left:n-(+C.slotsUsed[i+1]||0)})).filter(o=>o.lv>=s.lvl);
    openSheet(`<div class="sh">${spellGlyph(s)}<h3>${esc(s.name)}</h3><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic("x")}</button></div>
     <p class="muted" style="margin:0">Scegli lo slot da spendere.${s.up?` Ogni livello sopra il ${s.lvl}° aggiunge ${esc(s.up)}.`:""}</p>
     <div class="row">${opts.map(o=>`<button class="btn arc" data-act="cast-slot" data-id="${s.id}" data-l="${o.lv}" ${o.left<1?"disabled":""}>${o.lv}° livello · ${o.left} rimasti</button>`).join("")||"<span class='muted'>Nessuno slot disponibile.</span>"}</div>
     ${s.ritual?`<button class="btn ghost" data-act="cast-slot" data-id="${s.id}" data-l="rit">Lancia come rituale (+10 minuti, nessuno slot)</button>`:""}`);return}
  if(slot&&slot!=="rit"){C.slotsUsed[slot]=(+C.slotsUsed[slot]||0)+1;save()}
  closeSheet();render();
  let dmg=s.dmg?(s.lvl===0?cantripDice(s.dmg):s.dmg):"";
  if(dmg&&s.up&&slot&&slot!=="rit"&&+slot>s.lvl)for(let i=s.lvl;i<+slot;i++)dmg+="+"+s.up;
  if(dmg&&s.addMod)dmg+=sgn(castMod()).replace("−","-");
  const v=spellLook(s),head={title:s.name+(slot&&slot!=="rit"&&+slot>s.lvl?` · slot ${slot}°`:""),icon:spellGlyph(s),color:v.c};
  if(s.kind==="attack")attackFlow({...head,bonus:spellAtk(),dmg,dmgType:s.dmgType});
  else if(s.kind==="save")saveFlow({...head,dc:spellDC(),saveAb:s.save||"dex",dmg,dmgType:s.dmgType,onSave:s.onSave||"none"});
  else toast({title:`${s.name} lanciato${slot&&slot!=="rit"?` (slot di ${slot}° livello)`:""}.`});
  if(s.conc)setTimeout(()=>toast({title:"Concentrazione: ricordati di mantenerla."}),500);
}

   </div>

  <section class="plate">
   <div class="filters" role="tablist">${[["tutto","Tutto","layout-grid"],...CATS].map(([k,l,i])=>`<button class="chip ${invFilter===k?"on":""}" data-act="filter" data-f="${k}">${ic(i,"sm")}${l}</button>`).join("")}</div>

const inBag=it=>it&&it.parent?C.inventory.find(i=>i.id===it.parent&&i.container):null;
function descendants(id){const out=[];const walk=p=>C.inventory.forEach(i=>{if(i.parent===p&&!out.includes(i.id)){out.push(i.id);walk(i.id)}});walk(id);return out}
const bagKg=id=>descendants(id).map(x=>C.inventory.find(i=>i.id===x)).reduce((s,i)=>s+(+i.kg||0)*(+i.qty||1),0);
const kgFmt=v=>v.toLocaleString("it",{maximumFractionDigits:1});
function bagPath(id){const out=[];let b=C.inventory.find(i=>i.id===id);const seen=new Set();while(b&&!seen.has(b.id)){seen.add(b.id);out.unshift(b);b=inBag(b)}return out}
function slotHtml(it,showBag){const kids=it.container?C.inventory.filter(i=>i.parent===it.id).length:0,where=showBag&&inBag(it);
  return`<button class="slot c-${it.cat} ${it.equipped?"eq":""} ${it.attuned?"att":""} ${it.tint?"tint-"+it.tint:""} ${it.container?"bagslot":""}" data-act="item" data-id="${it.id}" aria-label="${esc(it.name)}${it.container?", contenitore con "+kids+" oggetti":""}">
    ${ic(it.icon||"box")}<span class="n">${esc(it.name)}</span>${(+it.qty||1)>1?`<span class="q">×${it.qty}</span>`:""}${it.container?`<span class="cnt">${kids}</span>`:""}${where?`<span class="inbag">${ic("shopping-bag","sm")}</span>`:""}</button>`}
function openBag(id){
  const b=C.inventory.find(i=>i.id===id);if(!b)return closeSheet();
  const path=bagPath(id),kids=C.inventory.filter(i=>i.parent===id),empt=Math.max(0,Math.ceil((kids.length+1)/4)*4-kids.length-1,7-kids.length);
  const up=inBag(b);
  openSheet(`<div class="sh">${up?`<button class="iconbtn" data-act="bag" data-id="${up.id}" aria-label="Torna a ${esc(up.name)}">${ic("arrow-left")}</button>`:""}<span class="badgeic" style="width:48px;height:48px">${ic("package-open")}</span><h3>${esc(b.name)}</h3><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic("x")}</button></div>
   <nav class="crumbs" aria-label="Percorso"><button data-act="close">${ic("backpack","sm")}Zaino</button>${path.map(p=>`<span>›</span><button data-act="bag" data-id="${p.id}" ${p.id===id?'aria-current="true"':""}>${esc(p.name)}</button>`).join("")}</nav>
   <div class="row" style="justify-content:space-between"><span class="lbl">${kids.length} oggett${kids.length===1?"o":"i"} · ${kgFmt(bagKg(id))} kg di contenuto</span><button class="btn sm ghost" data-act="item" data-id="${id}">${ic("info","sm")}Dettagli</button></div>
   <div class="grid baggrid">${kids.map(k=>slotHtml(k)).join("")}<button class="slot add" data-act="item-new" data-parent="${id}" aria-label="Aggiungi qui">${ic("plus")}<span class="n">Aggiungi qui</span></button>${"<div class='slot empty'></div>".repeat(empt)}</div>
   <p class="lbl" style="margin:0">Tocca due volte una borsa qui dentro per aprirla. Per spostare un oggetto, modificalo e scegli “Si trova in”.</p>`);
}

function castSpell(id,slot){
  const s=allSpells().find(x=>x.id===id);if(!s)return;
  if(s.lvl>0&&!slot){
    const sl=slotsArr();const opts=sl.map((n,i)=>({lv:i+1,left:n-(+C.slotsUsed[i+1]||0)})).filter(o=>o.lv>=s.lvl);
    openSheet(`<div class="sh"><h3>${esc(s.name)}</h3><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic("x")}</button></div>
     <p class="muted" style="margin:0">Scegli lo slot da spendere.${s.up?` Ogni livello sopra il ${s.lvl}° aggiunge ${esc(s.up)}.`:""}</p>
     <div class="row">${opts.map(o=>`<button class="btn arc" data-act="cast-slot" data-id="${s.id}" data-l="${o.lv}" ${o.left<1?"disabled":""}>${o.lv}° livello · ${o.left} rimasti</button>`).join("")||"<span class='muted'>Nessuno slot disponibile.</span>"}</div>
     ${s.ritual?`<button class="btn ghost" data-act="cast-slot" data-id="${s.id}" data-l="rit">Lancia come rituale (+10 minuti, nessuno slot)</button>`:""}`);
    return;
  }
  if(slot&&slot!=="rit"){C.slotsUsed[slot]=(+C.slotsUsed[slot]||0)+1;save();}
  closeSheet();
  let dmg=s.dmg?(s.lvl===0?cantripDice(s.dmg):s.dmg):"";
  if(dmg&&s.up&&slot&&slot!=="rit"&&+slot>s.lvl){for(let i=s.lvl;i<+slot;i++)dmg+="+"+s.up}
  if(dmg&&s.addMod)dmg+=sgn(castMod()).replace("−","-");
  if(s.kind==="attack")rollCheck(s.name+" · attacco",spellAtk(),{dmg,dmgType:s.dmgType});
  else if(dmg)toast({title:`${s.name} · CD ${spellDC()} ${s.save?("TS "+ABN[s.save][1]):""}`,big:rollExpr(dmg).total,br:`${esc(dmg)} ${esc(s.dmgType||"")} · metà se il bersaglio riesce`});
  else toast({title:`${s.name} lanciato${slot&&slot!=="rit"?` (slot di ${slot}° livello)`:""}.`});
  if(s.conc)setTimeout(()=>toast({title:"Ricorda: stai mantenendo la concentrazione."}),400);
  render();
}

    if(pd&&assets){try{const r=await assets.upload(await (await fetch(pd)).blob());d.portrait=r.id}catch(e){}}

    closeSheet();await switchChar(id,d);toast({title:`${d.name} importato.`})},
  logout:()=>{window.officinaLogout?.()},
  /* Soft_reset: riporta la partita allo stato di partenza senza toccare il personaggio */
  "soft-reset":()=>{openSheet(`<div class="sh"><h3>Soft_reset</h3><button class="iconbtn" data-act="close" aria-label="Chiudi">${ic("x")}</button></div>
     <p class="muted" style="margin:0">Riporta ${esc(C.name)} come se aprissi l'app per la prima volta, pronto a giocare.</p>
     <ul class="restlist"><li><b>Ripristina:</b> PF al massimo (${hpMax()}), PF temporanei, dadi vita, slot incantesimo, TS contro la morte, condizioni, Livello di Indebolimento, Ispirazione eroica, Cannone Arcano, Lampo di Genio e la cronologia dei dadi.</li>
      <li><b>Non tocca:</b> caratteristiche, livello (${C.level}°), inventario e monete, incantesimi, infusioni, Invenzione Magica e diario.</li></ul>
     <div class="row"><button class="btn" data-act="soft-reset-ok">${ic("rotate-ccw","sm")}Esegui Soft_reset</button><button class="btn ghost" data-act="close">Annulla</button></div>`)},
  "soft-reset-ok":()=>{Object.assign(C,{hitDiceUsed:0,death:{s:0,f:0},stable:false,conditions:[],exhaustion:0,slotsUsed:{},inspiration:false,flashUsed:0});
    C.hp={...C.hp,current:hpMax(),temp:0};C.cannon={...C.cannon,active:false,hp:0,freeUsed:false};
    diceLog=[];lsSet("oa.log","[]");rollMode="norm";invFilter="tutto";gaugeShown=null;tab="scheda";lsSet("oa.tab",tab);
    closeSheet();save();render();window.scrollTo(0,0);toast({title:"Soft_reset completato: si riparte da zero."})},
  dsel:t=>{diceSel.f=+t.dataset.f;openDice()},
  dqty:t=>{diceSel.n=t.dataset.set?+t.dataset.set:Math.max(1,Math.min(30,diceSel.n+ +t.dataset.d));openDice()},
  dmod:t=>{diceSel.mod=Math.max(-20,Math.min(20,diceSel.mod+ +t.dataset.d));openDice()},
  droll:()=>{const s=diceSel,m=s.mod?sgn(s.mod).replace("−","-"):"",label=`${s.n}d${s.f}${s.mod?sgn(s.mod):""}`;closeSheet();
    if(s.f===20&&s.n===1)checkFlow({title:"d20"+(s.mod?" "+sgn(s.mod):""),bonus:s.mod,icon:ic("dices"),sub:"Tiro libero"});
    else showRoll({title:label,icon:ic("dices")},`${s.n}d${s.f}${m}`,{sub:"Tiro libero",label:"totale"})},
  "story-toggle":()=>{storyOpen=!storyOpen;render()},
  "portrait-toggle":()=>{portraitOpen=!portraitOpen;render()},
  "quest-add":t=>{const kind=t.dataset.k||"missione",id=uid();C.journal.quests.push({id,title:"",done:false,kind});save();render();const el=$("#q-"+id);if(el)el.focus()},
  item:t=>{const id=t.dataset.id,it=C.inventory.find(i=>i.id===id);if(!it)return;
    if(it.container&&!t.closest(".row")){if(lastTap.id===id&&Date.now()-lastTap.t<380){clearTimeout(lastTap.to);lastTap={};openBag(id);return}
      clearTimeout(lastTap.to);lastTap={id,t:Date.now(),to:setTimeout(()=>{lastTap={};itemSheet(id)},300)};return}
    itemSheet(id)},
  bag:t=>openBag(t.dataset.id),
  "item-new":t=>itemForm(null,t.dataset.parent||undefined),
  "item-del-ok":t=>{const id=t.dataset.id,it=C.inventory.find(i=>i.id===id),up=it&&it.parent;
    C.inventory.forEach(i=>{if(i.parent===id){if(up)i.parent=up;else delete i.parent}});
    C.inventory=C.inventory.filter(i=>i.id!==id);C.infusions.active=C.infusions.active.filter(a=>a.itemId!==id);save();if(up)openBag(up);else closeSheet();render()},
  "rw-miss":()=>{rwClose();toast({title:"Mancato."})},
  "rw-dmg":t=>{if(!RW)return;if(!RW.dmg){rwClose();toast({title:"Colpito!"});return}
    const crit=!!t.dataset.crit,expr=crit?RW.dmg.replace(/(\d*)d(\d+)/g,(m,n,f)=>`${(+n||1)*2}d${f}`):RW.dmg;
    showRoll(RW,expr,crit?{banner:"Critico: dadi dei danni raddoppiati",bcls:"crit"}:{})},
  "rw-save-ko":()=>{if(!RW)return;if(RW.dmg)showRoll(RW,RW.dmg,{});else{rwClose();toast({title:"Il bersaglio subisce l'effetto."})}},
  "rw-save-ok":()=>{if(!RW)return;if(RW.dmg&&RW.onSave==="half")showRoll(RW,RW.dmg,{half:true});
    else rwOpen(`${rwHead({...RW,sub:"Tiro salvezza superato"})}<div class="banner">Nessun effetto</div><div class="rw-actions"><button class="btn full" data-act="rw-close">Chiudi</button></div>`)}
});

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;lsSet("oa.tab",tab);render();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  if(t.closest("form")&&t.type==="submit")return;
  if(!C&&!["menu","new-char","new-char-ok","open-char","close","dice","qd","mode2","import","import-ok","logout","soft-reset","soft-reset-ok","dsel","dqty","dmod","droll","rw-close"].includes(t.dataset.act))return;
  A[t.dataset.act]?.(t,e);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.actChange==="infuse"){const k=t.dataset.k,v=t.value;C.infusions.active=C.infusions.active.filter(a=>a.key!==k);
    if(v){if(C.infusions.active.length>=K().infActive(C.level)){toast({title:"Hai raggiunto il limite di oggetti infusi."});render();return}C.infusions.active.push({key:k,itemId:v})}save();render();return}
  if(t.dataset.actChange==="saveprof"){const k=t.dataset.k;const cur=[...(C.saveProf||K().saves)];C.saveProf=t.checked?[...new Set([...cur,k])]:cur.filter(x=>x!==k);save();render();return}
  if(!t.dataset.bind||!C)return;
  let v=t.type==="checkbox"?t.checked:t.value;if(t.dataset.type==="num")v=v===""?0:+v;
  if(t.dataset.bind==="level")v=Math.max(1,Math.min(20,v||1));
  setPath(t.dataset.bind,v);save();
  if(t.dataset.rr||t.closest("#view")){rerenderOnBlur=false;render()}
});
document.addEventListener("change",e=>{const t=e.target;if(t.name==="icon"&&t.closest("#itemForm")){$("#iconSum").innerHTML=ic(t.value)+esc(iconName(t.value));icons();t.closest("details").open=false}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.live&&t.dataset.bind&&C){setPath(t.dataset.bind,t.value);save()}});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(rerenderOnBlur){const a=document.activeElement;if(!(a&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){rerenderOnBlur=false;render()}}},50)});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#rollWin").hidden)rwClose();else if(!$("#sheetWrap").hidden)closeSheet()});
$("#portraitInput").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||!assets)return;
  try{toast({title:"Carico il ritratto…"});const r=await assets.upload(f);C.portrait=r.id;save();render()}
  catch(err){toast({title:err?.code==="too_large"?"Immagine troppo grande (max 20 MB).":"Caricamento non riuscito."})}});

/* ---------- avvio ---------- */
async function switchChar(id,fresh){
  charId=id;lsSet("oa.char",id);if(unsub){unsub();unsub=null}C=null;loaded=!db;
  if(db){ref=db.doc("characters/"+id);
    if(fresh){C=migrate(fresh);try{await ref.set(clone(C))}catch(e){toast({title:"Non riesco a creare il personaggio."})}}
    unsub=ref.onSnapshot(snap=>{
      if(!snap.exists){loaded=true;if(!C)render();return}
      loaded=true;
      if(dirty||saving||snap.metadata.hasPendingWrites)return;
      C=migrate(clone(snap.data()));setSync("ok");render();
    },err=>{setSync("err");toast({title:"Connessione alla scheda interrotta: ricarica la pagina."})});
  }else{
    const raw=lsGet("oa.local."+id);C=fresh?migrate(fresh):raw?migrate(JSON.parse(raw)):null;if(fresh)save();render();
  }
  render();
}
(async function boot(){
  try{GearWall.init($("#bgart"))}catch(e){}icons();
  try{ if(window.claude?.use){[db,assets]=await Promise.all([claude.use("db"),claude.use("assets")])} }catch(e){db=null}
  storeMode=db?"db":"local";
  await switchChar(charId);
})();
</script>

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
